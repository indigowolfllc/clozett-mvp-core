name: Video CloZett Autodeploy MVP
on:
push:
branches: [ main ]
workflow_dispatch:
jobs:
deploy:
runs-on: ubuntu-latest
steps:
- name: Checkout Repository
uses: actions/checkout@v4
- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '20'
- name: Install Dependencies
run: npm ci
- name: Build Next.js App
run: npm run build
env:
NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
- name: Post to Slack (Success)
if: success()
run: |
curl -X POST -H 'Content-type: application/json' --data "{"text": "✅ Video CloZett Deploy Success\nVersion: 2602271000"}" ${{ secrets.SLACK_WEBHOOK_URL }}
- name: Post to Slack (Failure)
if: failure()
run: |
curl -X POST -H 'Content-type: application/json' --data "{"text": "🚨 Video CloZett Deploy Failed"}" ${{ secrets.SLACK_WEBHOOK_URL }}
